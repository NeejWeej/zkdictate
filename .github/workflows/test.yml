name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Check installer syntax
        run: bash -n install.sh Install.command scripts/test_native.sh zkdictate
      - run: uv sync --locked
      - run: make test
      - run: make test-native
      - run: make app
      - run: uv build
      - name: Save source and Python packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-and-python-packages
          path: |
            dist/*.tar.gz
            dist/*.whl
          retention-days: 14
          if-no-files-found: error
