name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
          enable-cache: true
      - name: Check installer syntax
        run: bash -n install.sh Install.command scripts/test_native.sh zkdictate
      - run: uv sync --locked
      - run: make test
      - run: make test-native
      - run: make app
      - run: uv build
      - name: Save source and Python packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-and-python-packages
          path: |
            dist/*.tar.gz
            dist/*.whl
          retention-days: 14
          if-no-files-found: error
